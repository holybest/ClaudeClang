jenkins:
  systemMessage: "ClaudeClang CI (Jenkins LTS) — 빌드는 ClaudeCLangBuild 이미지 안에서 실행됩니다."
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >
      multibranchPipelineJob('ClaudeClang') {
        displayName('ClaudeClang')
        branchSources {
          github {
            id('claudeclang-github')
            repoOwner('holybest')
            repository('ClaudeClang')
          }
        }
        factory {
          workflowBranchProjectFactory { scriptPath('Jenkinsfile') }
        }
        orphanedItemStrategy { discardOldItems { numToKeep(20) } }
        // 익명 GitHub API 한도는 시간당 60회이고 스캔 1회가 여러 번을 쓴다. 5분 주기는 한도를 소진해 스캔이 멈춘다.
        // 푸시 직후에는 Jenkins 화면의 'Scan Repository Now'로 직접 스캔한다. 자주 돌리려면 GitHub 토큰 자격 증명을 추가한다.
        triggers { periodicFolderTrigger { interval('1h') } }
      }
